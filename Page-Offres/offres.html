<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="offres.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <title>Page Offres</title>
</head>
<body class="body">
    <section class="arriere">
        <div class="navbar">
            <div class="logo">
                <img src="assets/images/logo.svg" alt="Logo du site">
                <p class="navtext1"><b>Films</b></p>
                <p class="navtext">Cinéma</p>
                <p class="navtext">Offres</p>
            </div>
            <div class="connexion">
                <button class="icone"><i class="fa-solid fa-magnifying-glass" style="color: rgb(255, 252, 252);"></i></button>
                <button class="icone"><i class="fa-regular fa-user" style="color: white;"></i></button>
                <h3 style="color: white; margin: 0;padding-top: 10px;">FR</h3>
                <button style="background-color: transparent; border: none; padding-top: -100px;height: 40px;"><i class="fa-solid fa-circle-chevron-down" style="color: white;"></i></button>
            </div>
        </div>
        <div class="big-title">
            <h1 class="tt1 yy">NOS OFFRES , <br>A PORTEE DE MAIN</h1>
            <p class="sous yy">Enrichissez votre expérience avec nos offres exclusives,<br> accessibles directement depuis votre téléphone.</p>
        </div>
        <div class="app">
            <div class="app-text">
                <h1 class="down">Application</h1>
                <p class="down ui">Découvrez notre application mobile</p>
                <button class="btn"><b>Télécharger</b></button>
            </div>
            <img class="phone" src="assets/images/app-landing (1).png" alt="Téléphone avec l'application">
        </div>
    </section>
</body>
</html>
